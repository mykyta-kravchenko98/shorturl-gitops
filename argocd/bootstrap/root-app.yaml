apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/mykyta-kravchenko98/shorturl-gitops.git"
    targetRevision: "main"
    path: helm/app-of-apps
    helm:
      parameters:
        - name: git.repoURL
          value: "https://github.com/mykyta-kravchenko98/shorturl-gitops.git"
          forceString: true
        - name: git.targetRevision
          value: "main"
          forceString: true
        - name: shorturl.valuesFile
          value: "values-local.yaml"
          forceString: true
        - name: ci.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/directory/recurse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
