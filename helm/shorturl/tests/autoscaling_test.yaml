suite: autoscaling controls Deployment replicas
templates:
  - templates/deployment.yaml
  - templates/hpa.yaml
tests:
  - it: renders fixed replicas and no HPA when autoscaling is disabled
    set:
      autoscaling.enabled: false
      replicaCount: 2
      otel.sidecar.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        template: templates/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/hpa.yaml

  - it: removes Deployment replicas and renders the HPA when autoscaling is enabled
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 5
      otel.sidecar.enabled: false
    asserts:
      - notExists:
          path: spec.replicas
        template: templates/deployment.yaml
      - isKind:
          of: HorizontalPodAutoscaler
        template: templates/hpa.yaml
      - equal:
          path: spec.minReplicas
          value: 2
        template: templates/hpa.yaml
      - equal:
          path: spec.maxReplicas
          value: 5
        template: templates/hpa.yaml
