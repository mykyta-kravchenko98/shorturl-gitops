suite: application ConfigMap checksum
templates:
  - templates/deployment.yaml
release:
  name: shorturl-test
tests:
  - it: renders a checksum for the default application ConfigMap
    set:
      otel.sidecar.enabled: false
      server.restPort: "8585"
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[a-f0-9]{64}$

  - it: renders a checksum after ConfigMap input changes
    set:
      otel.sidecar.enabled: false
      server.restPort: "8586"
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[a-f0-9]{64}$
