suite: application ConfigMap checksum
templates:
  - templates/deployment.yaml
release:
  name: shorturl-test
tests:
  - it: records the checksum for the default application ConfigMap
    set:
      otel.sidecar.enabled: false
      server.restPort: "8585"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 5dc22cb901d6e538314a987fc95adb91876cb285ebc03a3724edededec76af3c
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 1b7f377af671058618077ff52ac3c6d76b049fd3a98e91c7ff619fb96279e96c

  - it: records a different checksum after ConfigMap input changes
    set:
      otel.sidecar.enabled: false
      server.restPort: "8586"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 1b7f377af671058618077ff52ac3c6d76b049fd3a98e91c7ff619fb96279e96c
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 5dc22cb901d6e538314a987fc95adb91876cb285ebc03a3724edededec76af3c
