{{- if .Values.postgres.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentials.secretName }}
  labels:
    {{- include "shorturl.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "postgres.credentials.username is required when credentials.create=true" .Values.postgres.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.credentials.password is required when credentials.create=true" .Values.postgres.credentials.password | quote }}
  POSTGRES_DB: {{ required "postgres.credentials.database is required when credentials.create=true" .Values.postgres.credentials.database | quote }}
{{- end }}
