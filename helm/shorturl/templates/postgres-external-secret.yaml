{{- if .Values.secretsManagement.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretsManagement.externalSecret.targetSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shorturl.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretsManagement.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretsManagement.externalSecret.secretStoreName }}
    kind: {{ .Values.secretsManagement.externalSecret.secretStoreKind }}
  target:
    name: {{ .Values.secretsManagement.externalSecret.targetSecretName }}
    creationPolicy: Owner
    # Don't let Argo CD's label-based tracking mistake this ESO-created
    # Secret for an orphaned member of the shorturl Application and prune it.
    template:
      metadata:
        labels: {}
        annotations: {}
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.secretsManagement.postgresSecretName | quote }}
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.secretsManagement.postgresSecretName | quote }}
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.secretsManagement.postgresSecretName | quote }}
        property: dbname
{{- end }}
