{{- if .Values.postgres.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
  labels:
    {{- include "shorturl.labels" . | nindent 4 }}
  annotations:
    # post-install/post-upgrade, not pre-*: when PostgreSQL is deployed by
    # this chart, a pre-install hook would run before its Service and
    # StatefulSet exist. The same Job can also target an external database.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorturl
        app.kubernetes.io/component: postgres-migrate
    spec:
      restartPolicy: Never
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.postgres.image }}"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.credentials.secretName }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.postgres.host }} -p {{ .Values.postgres.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        # Migrations are embedded (go:embed) into this image at build time
        # from the ShortUrl repo itself (cmd/migrate) - same commit, same
        # tag as the app image, no separate ConfigMap to keep in sync by
        # hand.
        - name: migrate
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          image: "{{ include "shorturl.imageRef" .Values.postgres.migrateImage }}"
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.postgres.sslMode | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.credentials.secretName }}
{{- end }}
