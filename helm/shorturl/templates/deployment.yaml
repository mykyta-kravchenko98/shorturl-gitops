apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shorturl.fullname" . }}
  labels:
    {{- include "shorturl.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "shorturl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shorturl.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
        app.kubernetes.io/version: {{ .Values.imageVersion | quote }}
      annotations:
        checksum/config: {{ include "shorturl.configmap" . | sha256sum }}
        {{- if .Values.otel.sidecar.enabled }}
        checksum/otel-sidecar-config: {{ include "shorturl.otelSidecarConfig" . | sha256sum }}
        {{- end }}
    spec:
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shorturl
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ include "shorturl.imageRef" (dict "image" .Values.image "version" .Values.imageVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.restPort }}
          env:
            - name: environment
              value: "prod"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.credentials.secretName }}
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yml
              subPath: config.yml
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.otel.sidecar.enabled }}
        - name: otel-collector-sidecar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: "{{ .Values.otel.sidecar.image }}"
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            {{- toYaml .Values.otel.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: otel-sidecar-config
              mountPath: /etc/otel
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "shorturl.fullname" . }}-config
        {{- if .Values.otel.sidecar.enabled }}
        - name: otel-sidecar-config
          configMap:
            name: otel-sidecar-config
        {{- end }}
