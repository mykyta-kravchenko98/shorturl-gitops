# Overrides applied on top of values.yaml for the local kind environment.
replicaCount: 1

image:
  pullPolicy: IfNotPresent

autoscaling:
  enabled: false

# The local environment keeps the complete AWS/controller integration enabled.
# CI can override each capability independently without changing this profile.
secretsManagement:
  secretStore:
    create: true
  externalSecret:
    enabled: true
  credentialRotation:
    enabled: true

imagePullSecret:
  enabled: true

ecrRefresh:
  enabled: true

otel:
  sidecar:
    enabled: true
