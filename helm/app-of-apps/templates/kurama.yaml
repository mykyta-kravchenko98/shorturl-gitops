{{- if or (not .Values.ci.enabled) .Values.ci.controllersEnabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kurama
  namespace: argocd
  annotations:
    # Install the CRD/controller before ordinary application workloads.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: {{ .Values.git.repoURL | quote }}
    targetRevision: {{ .Values.git.targetRevision | quote }}
    path: k8s/kurama
    {{- if not .Values.kurama.externalSecret.enabled }}
    kustomize:
      patches:
        - target:
            group: external-secrets.io
            version: v1
            kind: ExternalSecret
            name: shorturl-api-auth
          patch: |-
            $patch: delete
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: shorturl-api-auth
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: shorturl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # TrafficScenario and its CRD are introduced in the same sync.
      - SkipDryRunOnMissingResource=true
{{- end }}
