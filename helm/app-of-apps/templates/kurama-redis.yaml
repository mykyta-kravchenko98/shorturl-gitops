{{- if not .Values.ci.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kurama-redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.git.repoURL | quote }}
    targetRevision: {{ .Values.git.targetRevision | quote }}
    path: k8s/kurama-redis
  destination:
    server: https://kubernetes.default.svc
    namespace: kurama-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
