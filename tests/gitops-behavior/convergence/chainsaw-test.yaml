apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gitops-upgrade-and-self-heal
spec:
  namespace: default
  steps:
    - name: Argo CD reconciles the committed revision
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: root
                namespace: argocd
              status:
                sync:
                  revision: ($values.revision)
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: shorturl
                namespace: argocd
              spec:
                syncPolicy:
                  automated:
                    selfHeal: true
              status:
                sync:
                  revision: ($values.revision)
                  status: Synced
                health:
                  status: Healthy

    - name: committed replica change completes its rollout
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: shorturl
                namespace: shorturl
              spec:
                replicas: 2
              status:
                replicas: 2
                readyReplicas: 2
                updatedReplicas: 2
                availableReplicas: 2
        - script:
            shell: bash
            shellArgs: [-c]
            timeout: 1m
            content: |
              set -euo pipefail
              log_file="$(mktemp)"
              kubectl -n shorturl port-forward service/shorturl 18585:8585 \
                >"${log_file}" 2>&1 &
              forward_pid=$!
              cleanup() {
                kill "${forward_pid}" >/dev/null 2>&1 || true
                wait "${forward_pid}" >/dev/null 2>&1 || true
                rm -f "${log_file}"
              }
              trap cleanup EXIT

              for _ in $(seq 1 30); do
                if curl --silent --fail http://127.0.0.1:18585/readyz \
                  >/dev/null; then
                  exit 0
                fi
                sleep 1
              done
              exit 1

    - name: introduce live replica drift
      try:
        - script:
            shell: bash
            shellArgs: [-c]
            timeout: 1m
            content: |
              set -euo pipefail
              response="$(kubectl -n shorturl patch deployment shorturl \
                --type merge \
                --patch '{"spec":{"replicas":3}}' \
                --output json)"
              jq -e '.spec.replicas == 3' <<<"${response}" >/dev/null

              # Force drift detection; automated selfHeal still owns the sync.
              kubectl -n argocd annotate application shorturl \
                argocd.argoproj.io/refresh=hard --overwrite >/dev/null

    - name: Argo CD restores the Git replica count
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: shorturl
                namespace: argocd
              status:
                sync:
                  revision: ($values.revision)
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: shorturl
                namespace: shorturl
              spec:
                replicas: 2
              status:
                replicas: 2
                readyReplicas: 2
                updatedReplicas: 2
                availableReplicas: 2
        - script:
            shell: bash
            shellArgs: [-c]
            timeout: 1m
            content: |
              set -euo pipefail
              log_file="$(mktemp)"
              kubectl -n shorturl port-forward service/shorturl 18585:8585 \
                >"${log_file}" 2>&1 &
              forward_pid=$!
              cleanup() {
                kill "${forward_pid}" >/dev/null 2>&1 || true
                wait "${forward_pid}" >/dev/null 2>&1 || true
                rm -f "${log_file}"
              }
              trap cleanup EXIT

              for _ in $(seq 1 30); do
                if curl --silent --fail http://127.0.0.1:18585/readyz \
                  >/dev/null; then
                  exit 0
                fi
                sleep 1
              done
              exit 1

    - name: repeated sync of the same revision is idempotent
      try:
        - script:
            shell: bash
            shellArgs: [-c]
            timeout: 5m
            env:
              - name: EXPECTED_REVISION
                value: ($values.revision)
            content: |
              set -euo pipefail
              application=shorturl
              initiator=gitops-idempotency-smoke
              pod_selector='app.kubernetes.io/name=shorturl,app.kubernetes.io/component=app'

              for _ in $(seq 1 60); do
                if kubectl -n argocd get application "${application}" \
                  -o json | jq -e '.operation == null' >/dev/null; then
                  break
                fi
                sleep 1
              done
              kubectl -n argocd get application "${application}" \
                -o json | jq -e '.operation == null' >/dev/null

              before_generation="$(kubectl -n shorturl get deployment shorturl \
                -o jsonpath='{.metadata.generation}')"
              before_pods="$(kubectl -n shorturl get pods \
                --selector "${pod_selector}" -o json | jq -r \
                '[.items[]
                  | select(.metadata.deletionTimestamp == null)
                  | .metadata.uid] | sort | join(",")')"
              test -n "${before_pods}"

              operation_patch="$(jq -cn \
                --arg initiator "${initiator}" \
                --arg revision "${EXPECTED_REVISION}" '
                  {
                    operation: {
                      initiatedBy: {username: $initiator},
                      sync: {
                        revision: $revision,
                        syncStrategy: {hook: {}}
                      }
                    }
                  }
                ')"
              kubectl -n argocd patch application "${application}" \
                --type merge --patch "${operation_patch}" >/dev/null

              for _ in $(seq 1 240); do
                application_json="$(kubectl -n argocd get application \
                  "${application}" -o json)"
                if jq -e \
                  --arg initiator "${initiator}" \
                  --arg revision "${EXPECTED_REVISION}" '
                    .operation == null and
                    .status.operationState.phase == "Succeeded" and
                    .status.operationState.operation.initiatedBy.username ==
                      $initiator and
                    .status.operationState.syncResult.revision == $revision and
                    .status.sync.revision == $revision and
                    .status.sync.status == "Synced" and
                    .status.health.status == "Healthy" and
                    ([.status.resources[]?
                      | select(.status != "Synced")] | length == 0)
                  ' <<<"${application_json}" >/dev/null; then
                  break
                fi
                sleep 1
              done

              application_json="$(kubectl -n argocd get application \
                "${application}" -o json)"
              jq -e \
                --arg initiator "${initiator}" \
                --arg revision "${EXPECTED_REVISION}" '
                  .operation == null and
                  .status.operationState.phase == "Succeeded" and
                  .status.operationState.operation.initiatedBy.username ==
                    $initiator and
                  .status.operationState.syncResult.revision == $revision and
                  .status.sync.revision == $revision and
                  .status.sync.status == "Synced" and
                  .status.health.status == "Healthy" and
                  ([.status.resources[]?
                    | select(.status != "Synced")] | length == 0)
                ' <<<"${application_json}" >/dev/null

              after_generation="$(kubectl -n shorturl get deployment shorturl \
                -o jsonpath='{.metadata.generation}')"
              after_pods="$(kubectl -n shorturl get pods \
                --selector "${pod_selector}" -o json | jq -r \
                '[.items[]
                  | select(.metadata.deletionTimestamp == null)
                  | .metadata.uid] | sort | join(",")')"

              test "${after_generation}" = "${before_generation}"
              test "${after_pods}" = "${before_pods}"
