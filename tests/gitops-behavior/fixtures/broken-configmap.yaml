apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-smoke-broken
  namespace: shorturl
data:
  collision: broken-manifest
binaryData:
  # Kubernetes rejects a ConfigMap when data and binaryData share a key. The
  # manifest is otherwise structurally valid, so Argo CD reaches the apply
  # phase and records a controlled SyncFailed result.
  collision: YnJva2VuLW1hbmlmZXN0
