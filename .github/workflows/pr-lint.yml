# Aggregated static analysis for every PR - Helm, Terraform, raw k8s
# manifests, Dockerfiles, YAML style, shell scripts, and a secret scan.
# No deploy here, just checks - config lives in .mega-linter.yml.
name: PR Lint

on:
  pull_request:
    branches: [main]

jobs:
  static-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned installer version
        id: static_versions
        run: |
          mise_version="$(awk -F= '$1 == "MISE_VERSION" { print $2 }' tools/static-versions.env)"
          test -n "${mise_version}"
          printf 'mise=%s\n' "${mise_version}" >> "${GITHUB_OUTPUT}"

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: ${{ steps.static_versions.outputs.mise }}
          install: false
          cache: false

      - name: Install pinned static toolchain
        run: bash ./scripts/install-static-tools-ci.sh

      - name: Run complete static gate
        run: make test-static

  megalinter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # lets MegaLinter comment/annotate the PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # MegaLinter's diff-only mode needs real history
          persist-credentials: false

      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/terraform@e08c2b05e3dbc40af4c23f41172ef1e068a7d651 # v8
        env:
          VALIDATE_ALL_CODEBASE: false   # only lint files changed in the PR
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
